<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体报表系统 - 管理中心</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .top-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 主体容器 */
        .main-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 240px;
            background: #fff;
            border-right: 1px solid #e4e7ed;
            overflow-y: auto;
            transition: width 0.3s;
        }

        .sidebar.collapsed {
            width: 64px;
        }

        /* 侧边栏菜单项 */
        .menu-item {
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #303133;
        }

        .menu-item:hover {
            background: #f5f7fa;
            border-left-color: #409EFF;
        }

        .menu-item.active {
            background: #ecf5ff;
            border-left-color: #409EFF;
            color: #409EFF;
            font-weight: 600;
        }

        .menu-item-icon {
            font-size: 18px;
            min-width: 18px;
            text-align: center;
        }

        .menu-item-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-item-arrow {
            font-size: 12px;
            transition: transform 0.3s;
        }

        .menu-item-arrow.expanded {
            transform: rotate(90deg);
        }

        /* 子菜单 */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #fafafa;
        }

        .submenu.expanded {
            max-height: 500px;
        }

        .submenu-item {
            padding: 12px 20px 12px 48px;
            cursor: pointer;
            transition: all 0.3s;
            color: #606266;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .submenu-item:hover {
            background: #f0f2f5;
            border-left-color: #409EFF;
        }

        .submenu-item.active {
            background: #e6f7ff;
            border-left-color: #409EFF;
            color: #409EFF;
            font-weight: 500;
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .content-header {
            margin-bottom: 20px;
        }

        .content-title {
            font-size: 24px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 8px;
        }

        .content-subtitle {
            font-size: 14px;
            color: #909399;
        }

        /* 内容卡片 */
        .content-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        /* iframe 容器 */
        .iframe-container {
            width: 100%;
            height: calc(100vh - 140px);
            border: none;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <!-- 顶部导航栏 -->
        <div class="top-header">
            <div class="header-title">
                <span>📊</span>
                <span>媒体报表系统</span>
            </div>
        </div>

        <!-- 主体容器 -->
        <div class="main-wrapper">
            <!-- 左侧边栏 -->
            <div class="sidebar">
                <!-- 巨量报表 -->
                <div>
                    <div class="menu-item" :class="{active: currentMenu === 'juliang'}" @click="toggleMenu('juliang')">
                        <span class="menu-item-icon">📈</span>
                        <span class="menu-item-text">巨量报表</span>
                        <span class="menu-item-arrow" :class="{expanded: expandedMenus.includes('juliang')}">▶</span>
                    </div>
                    <div class="submenu" :class="{expanded: expandedMenus.includes('juliang')}">
                        <div class="submenu-item" :class="{active: currentPage === 'rebate'}" @click="navigateTo('rebate', '返点配置')">
                            返点配置
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'servicefee'}" @click="navigateTo('servicefee', '服务费配置')">
                            服务费配置
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'tasktype'}" @click="navigateTo('tasktype', '任务类型配置')">
                            任务类型配置
                        </div>
                    </div>
                </div>

                <!-- 汇川报表 -->
                <div>
                    <div class="menu-item" :class="{active: currentMenu === 'huichuan'}" @click="toggleMenu('huichuan')">
                        <span class="menu-item-icon">📊</span>
                        <span class="menu-item-text">汇川报表</span>
                        <span class="menu-item-arrow" :class="{expanded: expandedMenus.includes('huichuan')}">▶</span>
                    </div>
                    <div class="submenu" :class="{expanded: expandedMenus.includes('huichuan')}">
                        <div class="submenu-item" :class="{active: currentPage === 'elm_hc'}" @click="navigateTo('elm_hc', '汇川饿了么报表')">
                            汇川饿了么报表
                        </div>
                    </div>
                </div>

                <!-- 菜鸟账户 -->
                <div>
                    <div class="menu-item" :class="{active: currentPage === 'cainiao'}" @click="navigateTo('cainiao', '菜鸟时报账户')">
                        <span class="menu-item-icon">🏪</span>
                        <span class="menu-item-text">菜鸟时报账户</span>
                    </div>
                </div>

                <!-- 京东广义数据统计 -->
                <div>
                    <div class="menu-item" :class="{active: currentPage === 'jd_attribution'}" @click="navigateTo('jd_attribution', '京东广义数据统计')">
                        <span class="menu-item-icon">📉</span>
                        <span class="menu-item-text">京东广义数据统计</span>
                    </div>
                </div>

                <!-- 飞猪报表 -->
                <div>
                    <div class="menu-item" :class="{active: currentMenu === 'feizhu'}" @click="toggleMenu('feizhu')">
                        <span class="menu-item-icon">✈️</span>
                        <span class="menu-item-text">飞猪报表</span>
                        <span class="menu-item-arrow" :class="{expanded: expandedMenus.includes('feizhu')}">▶</span>
                    </div>
                    <div class="submenu" :class="{expanded: expandedMenus.includes('feizhu')}">
                        <div class="submenu-item" :class="{active: currentPage === 'fz_advertiser'}" @click="navigateTo('fz_advertiser', '飞猪账户管理')">
                            账户管理
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'fz_hourly_report'}" @click="navigateTo('fz_hourly_report', '飞猪数据报表')">
                            数据报表
                        </div>
                    </div>
                </div>

                <!-- 汽车之家 -->
                <div>
                    <div class="menu-item" :class="{active: currentMenu === 'qczj'}" @click="toggleMenu('qczj')">
                        <span class="menu-item-icon">🚗</span>
                        <span class="menu-item-text">汽车之家</span>
                        <span class="menu-item-arrow" :class="{expanded: expandedMenus.includes('qczj')}">▶</span>
                    </div>
                    <div class="submenu" :class="{expanded: expandedMenus.includes('qczj')}">
                        <div class="submenu-item" :class="{active: currentPage === 'qczj_config'}" @click="navigateTo('qczj_config', '比例配置')">
                            比例配置
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'qczj_report'}" @click="navigateTo('qczj_report', '数据报表')">
                            数据报表
                        </div>
                    </div>
                </div>

                <!-- 转链 -->
                <div>
                    <div class="menu-item" :class="{active: currentMenu === 'ulink'}" @click="toggleMenu('ulink')">
                        <span class="menu-item-icon">🔗</span>
                        <span class="menu-item-text">转链</span>
                        <span class="menu-item-arrow" :class="{expanded: expandedMenus.includes('ulink')}">▶</span>
                    </div>
                    <div class="submenu" :class="{expanded: expandedMenus.includes('ulink')}">
                        <div class="submenu-item" :class="{active: currentPage === 'ulink_taobao'}" @click="navigateTo('ulink_taobao', '淘宝转链')">
                            淘宝转链
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'ulink_xianyu'}" @click="navigateTo('ulink_xianyu', '闲鱼转链')">
                            闲鱼转链
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'ulink_activity'}" @click="navigateTo('ulink_activity', '活动转链')">
                            活动转链
                        </div>
                        <div class="submenu-item" :class="{active: currentPage === 'ulink_cps_goods'}" @click="navigateTo('ulink_cps_goods', 'CPS高佣商品库')">
                            CPS高佣商品库
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="content-area">
                <div class="content-header">
                    <div class="content-title">{{ pageTitle }}</div>
                    <div class="content-subtitle">{{ pageSubtitle }}</div>
                </div>

                <!-- 使用 iframe 加载不同页面 -->
                <iframe v-if="currentPageUrl" 
                        :src="currentPageUrl" 
                        class="iframe-container"
                        frameborder="0">
                </iframe>

                <!-- 默认欢迎页面 -->
                <div v-else class="content-card" style="text-align: center; padding: 60px 20px;">
                    <div style="font-size: 64px; margin-bottom: 20px;">👋</div>
                    <div style="font-size: 24px; font-weight: 600; color: #303133; margin-bottom: 10px;">
                        欢迎使用媒体报表系统
                    </div>
                    <div style="font-size: 14px; color: #909399;">
                        请从左侧菜单选择要查看的功能
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3.3.8/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

    <script>
        const { createApp } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        createApp({
            data() {
                return {
                    currentMenu: '',
                    currentPage: '',
                    pageTitle: '欢迎',
                    pageSubtitle: '请选择左侧菜单开始使用',
                    expandedMenus: ['juliang'], // 默认展开巨量报表
                    currentPageUrl: ''
                }
            },
            methods: {
                toggleMenu(menuName) {
                    if (this.expandedMenus.includes(menuName)) {
                        this.expandedMenus = this.expandedMenus.filter(m => m !== menuName);
                    } else {
                        this.expandedMenus.push(menuName);
                    }
                },
                navigateTo(page, title) {
                    this.currentPage = page;
                    this.currentMenu = ''; // 清除父菜单的选中状态
                    this.pageTitle = title;
                    
                    // 路径前缀：使用相对路径，由反向代理处理
                    const isProduction = window.location.pathname.includes('/guangyixinmedia/');
                    const pathPrefix = isProduction ? '/guangyixinmedia' : '';
                    
                    // 设置页面 URL 和副标题
                    const pageConfig = {
                        'rebate': {
                            url: `${pathPrefix}/web/config_rebate.html`,
                            subtitle: '管理返点配置信息'
                        },
                        'servicefee': {
                            url: `${pathPrefix}/web/config_servicefee.html`,
                            subtitle: '管理服务费配置信息'
                        },
                        'tasktype': {
                            url: `${pathPrefix}/web/config_tasktype.html`,
                            subtitle: '管理任务类型配置信息'
                        },
                        'elm_hc': {
                            url: `${pathPrefix}/web/elm_hc_report.html`,
                            subtitle: '查看汇川饿了么报表数据'
                        },
                        'cainiao': {
                            url: `${pathPrefix}/web/config_cainiao.html`,
                            subtitle: '管理菜鸟账户（快手广告主ID）'
                        },
                        'jd_attribution': {
                            url: `${pathPrefix}/web/jd_attribution.html`,
                            subtitle: '查看京东广义转化过滤数据统计'
                        },
                        'fz_advertiser': {
                            url: `${pathPrefix}/web/config_fz_advertiser.html`,
                            subtitle: '管理飞猪媒体账户（OPPO/小米/ADN）'
                        },
                        'fz_hourly_report': {
                            url: `${pathPrefix}/web/fz_hourly_report.html`,
                            subtitle: '查看飞猪媒体小时报数据'
                        },
                        'qczj_config': {
                            url: `${pathPrefix}/web/qczj_config.html`,
                            subtitle: '管理汽车之家 ADN 数据比例配置'
                        },
                        'qczj_report': {
                            url: `${pathPrefix}/web/qczj_report.html`,
                            subtitle: '查看汽车之家 ADN 数据报表'
                        },
                        'ulink_taobao': {
                            url: `${pathPrefix}/web/ulink_taobao.html`,
                            subtitle: '淘宝短链转 Deeplink（单链/批量）'
                        },
                        'ulink_xianyu': {
                            url: `${pathPrefix}/web/ulink_xianyu.html`,
                            subtitle: '闲鱼短链转 Deeplink（单链/批量）'
                        },
                        'ulink_activity': {
                            url: `${pathPrefix}/web/ulink_activity.html`,
                            subtitle: '淘宝客活动短链批量获取与报表查询'
                        },
                        'ulink_cps_goods': {
                            url: `${pathPrefix}/web/ulink_cps_goods.html`,
                            subtitle: '淘宝CPS高佣商品库批量导出'
                        }
                    };
                    
                    const config = pageConfig[page];
                    if (config) {
                        this.currentPageUrl = config.url;
                        this.pageSubtitle = config.subtitle;
                    }
                }
            },
            mounted() {
                console.log('媒体报表系统已加载');
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
