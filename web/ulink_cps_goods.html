<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPS高佣商品库</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .section-card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .section-title { font-size: 16px; font-weight: 600; color: #303133; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; gap: 8px; }
        .tip-text { color: #909399; font-size: 12px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
        .form-item { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 13px; color: #606266; font-weight: 500; }
        .stats-info { margin-top: 12px; color: #909399; font-size: 13px; }
        [v-cloak] { display: none; }
        .compact-upload .el-upload-dragger { height: 80px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px; }
        .compact-upload .el-upload-dragger .upload-inner { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="section-card">
            <div class="section-title">🏪 CPS高佣商品库导出</div>
            <div class="tip-text">
                上传 Excel 文件（A 列每行一个 adzone_id），选择商品库后点击获取，结果按 adzone_id 分组写入 Excel 文件下载
            </div>

            <div class="form-row">
                <div class="form-item">
                    <div class="form-label">商品库</div>
                    <el-select v-model="materialId" style="width: 280px;">
                        <el-option label="推荐商品大池 (80005)" value="80005"></el-option>
                        <el-option label="超U全量招商商品库 (102386)" value="102386"></el-option>
                        <el-option label="超U成交型商品库佣金膨胀 (102388)" value="102388"></el-option>
                        <el-option label="超U收益型商品库优选尖货 (102394)" value="102394"></el-option>
                    </el-select>
                </div>
            </div>

            <el-upload
                ref="upload"
                :auto-upload="false"
                :limit="1"
                accept=".xlsx,.xls"
                :on-change="onFileChange"
                :on-remove="onFileRemove"
                drag
                class="compact-upload"
                style="margin-bottom: 16px;"
            >
                <div class="upload-inner">
                    <span style="font-size: 22px; color: #c0c4cc;">📁</span>
                    <div>
                        <div style="color: #606266; font-size: 13px;">点击或拖拽 adzone_id 列表 Excel 到此处</div>
                        <div style="font-size: 12px; color: #909399; margin-top: 2px;">A 列每行一个 adzone_id</div>
                    </div>
                </div>
            </el-upload>

            <el-button type="primary" size="large" :loading="loading" :disabled="!uploadFile" @click="fetchGoods">
                获取并下载 Excel
            </el-button>

            <div v-if="statusMsg" class="stats-info">{{ statusMsg }}</div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3.3.8/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script>
        const { createApp } = Vue;
        const { ElMessage } = ElementPlus;

        createApp({
            data() {
                return {
                    materialId: '80005',
                    uploadFile: null,
                    loading: false,
                    statusMsg: '',
                }
            },
            methods: {
                apiBase() {
                    return window.location.pathname.includes('/guangyixinmedia/') ? '/guangyixinmedia' : '';
                },

                onFileChange(file) { this.uploadFile = file.raw; },
                onFileRemove() { this.uploadFile = null; },

                async fetchGoods() {
                    if (!this.uploadFile) {
                        ElMessage.warning('请先选择 adzone_id Excel 文件');
                        return;
                    }
                    this.loading = true;
                    this.statusMsg = '';
                    try {
                        const formData = new FormData();
                        formData.append('material_id', this.materialId);
                        formData.append('link_file', this.uploadFile);

                        const resp = await fetch(`${this.apiBase()}/api/ulink/cps/goods`, {
                            method: 'POST',
                            body: formData,
                        });

                        const contentType = resp.headers.get('Content-Type') || '';
                        if (!resp.ok || contentType.includes('application/json')) {
                            const err = await resp.json().catch(() => ({ message: '未知错误' }));
                            ElMessage.error(err.message || '获取失败');
                            return;
                        }

                        const blob = await resp.blob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `cps_goods_${this.materialId}.xlsx`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        this.statusMsg = '导出完成，Excel 已下载';
                        ElMessage.success('商品库导出完成');
                    } catch (e) {
                        ElMessage.error('请求失败: ' + e.message);
                    } finally {
                        this.loading = false;
                    }
                },
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
