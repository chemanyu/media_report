<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h3>Z方复投Cookie更新</h3>
  <p>用于更新京橙复投素材推送的Cookie</p>
    
  <div style="margin-bottom: 15px; padding: 8px; background-color: #e7f3ff; border-left: 3px solid #2196F3; font-size: 12px;">
    <strong>Cookie 来源：</strong>api.m.jd.com/api/（与复投接口真实请求头一致）
    <div style="margin-top: 4px; color: #555;">请先登录 https://jcheng.jd.com/ 并刷新页面</div>
  </div>

  <button id="sendButton">更新Cookie</button>
  <div id="status"></div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
